[project]
name = "diarium-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valdir Junior", email = "valdir.junior.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.33.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "typer>=0.27.2",
]

[project.scripts]
diarium-app = "diarium_app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
